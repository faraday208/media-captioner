[project]
name = "image-captioner"
version = "0.1.0"
description = "Multi-pass image captioning with Qwen3-VL-30B (Ollama backend)"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["image", "caption", "qwen", "vlm", "ollama", "dataset", "lora"]
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    # json-debugger UI için (opsiyonel ama workspace içinde paylaşılır)
    "gradio>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
