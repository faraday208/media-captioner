[project]
name = "media-captioner"
version = "1.0.1"
description = "Media multi-pass captioning (Qwen3-VL via Ollama) — 5-pass JSON + caption export + undo"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "image", "caption", "qwen", "vlm", "ollama", "dataset", "lora", "ai"]
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
